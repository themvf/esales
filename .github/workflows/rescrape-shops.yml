name: Re-scrape Etsy Shops

on:
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      max_listings:
        description: 'Max listings to scrape per shop'
        required: false
        default: '50'
        type: string
      shops:
        description: 'Specific shops to scrape (comma-separated, leave empty for all)'
        required: false
        default: ''
        type: string

  # Optional: Run on schedule (e.g., weekly on Sundays at 2 AM UTC)
  # schedule:
  #   - cron: '0 2 * * 0'

jobs:
  rescrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directory
        run: |
          mkdir -p data
          mkdir -p logs

      - name: Run re-scrape script
        env:
          MAX_LISTINGS: ${{ github.event.inputs.max_listings || '50' }}
          SPECIFIC_SHOPS: ${{ github.event.inputs.shops || '' }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          echo "Starting re-scrape process..."
          echo "Max listings per shop: $MAX_LISTINGS"
          if [ -n "$SPECIFIC_SHOPS" ]; then
            echo "Scraping specific shops: $SPECIFIC_SHOPS"
            python rescrape_shops.py --max-listings $MAX_LISTINGS --shops "$SPECIFIC_SHOPS"
          else
            echo "Scraping all shops in database"
            python rescrape_shops.py --max-listings $MAX_LISTINGS
          fi

      - name: Check for database changes
        id: git-check
        run: |
          # Check if database exists and has changes (modified or new)
          if [ -f data/etsy_sales.db ]; then
            git add data/etsy_sales.db
            if git diff --cached --quiet data/etsy_sales.db; then
              echo "No changes to database"
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "Database has changes"
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "Database file not found"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push database updates
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/etsy_sales.db
          git commit -m "Update Etsy sales data [automated]

          - Re-scraped shops using GitHub Actions
          - Updated sales counts and listings
          - Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs
          path: logs/
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "## Re-scrape Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Max listings**: ${{ github.event.inputs.max_listings || '50' }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.inputs.shops }}" ]; then
            echo "- **Shops**: ${{ github.event.inputs.shops }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Shops**: All shops in database" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Database has been updated and pushed to the repository." >> $GITHUB_STEP_SUMMARY
          echo "Streamlit Cloud will automatically redeploy with the new data." >> $GITHUB_STEP_SUMMARY
